[package]
name = "hairy_tracer_core"
version = "0.1.0"
edition = "2021"
description = "Intersection and BVH traversal core for the Hairy Tracer raytracer"

[lib]
name = "hairy_tracer_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "htrace"
path = "src/bin/htrace.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
glam = { version = "0.29", features = ["std"] }
image = "0.25"
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }
rand = "0.8.5"
rayon = "1.12.0"
scene_dsl = { path = "../scene_dsl" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
